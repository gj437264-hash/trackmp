        <!-- Critical CSS to prevent FOUC -->
        <style>
            body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FBF7F0; color: #2A1F1A; }
            #root { min-height: 100vh; }
            h1, h2, h3, h4, h5, h6 { font-family: 'Fraunces', Georgia, serif; }
            .font-loading { font-display: swap; }

            /* Cookie consent banner */
            #cc-banner {
                position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
                background: #2A1F1A; color: #FBF7F0;
                padding: 16px 20px; display: none;
                align-items: center; justify-content: space-between; gap: 16px;
                flex-wrap: wrap;
                font-size: 14px; line-height: 1.5;
                box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
            }
            #cc-banner.visible { display: flex; }
            #cc-banner p { margin: 0; max-width: 560px; }
            #cc-banner a { color: #FBF7F0; text-decoration: underline; }
            #cc-actions { display: flex; gap: 8px; flex-shrink: 0; }
            #cc-actions button {
                font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
                padding: 9px 18px; border-radius: 6px; border: 1px solid transparent;
                cursor: pointer;
            }
            #cc-accept { background: #FBF7F0; color: #2A1F1A; }
            #cc-reject { background: transparent; color: #FBF7F0; border-color: rgba(251,247,240,0.4); }
            #cc-accept:focus-visible, #cc-reject:focus-visible { outline: 2px solid #FBF7F0; outline-offset: 2px; }
        </style>

        <!-- Google Consent Mode -->
        <script>
            'use strict';
            window.dataLayer = window.dataLayer || [];
            function gtag() { window.dataLayer.push(arguments); }
            gtag('consent', 'default', {
                'ad_storage': 'denied',
                'analytics_storage': 'denied',
                'ad_user_data': 'denied',
                'ad_personalization': 'denied',
                'wait_for_update': 500
            });
        </script>

        <!-- Async GA4 -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-18EZD9W5GG"></script>
        <script>
            'use strict';
            (function() {
                gtag('js', new Date());
                gtag('config', 'G-18EZD9W5GG', {
                    'anonymize_ip': true,
                    'cookie_flags': 'SameSite=None; Secure',
                    'cookie_expires': 63072000,
                    'send_page_view': true,
                    'allow_google_signals': false,
                    'allow_ad_personalization_signals': false,
                    'use_amp_client_id': false
                });
            })();
            window.updateConsent = function(granted) {
                if (granted) {
                    gtag('consent', 'update', {
                        'ad_storage': 'granted',
                        'analytics_storage': 'granted',
                        'ad_user_data': 'granted',
                        'ad_personalization': 'granted'
                    });
                    gtag('event', 'page_view', {
                        'page_title': document.title,
                        'page_location': window.location.href,
                        'send_to': 'G-18EZD9W5GG'
                    });
                } else {
                    gtag('consent', 'update', {
                        'ad_storage': 'denied',
                        'analytics_storage': 'denied',
                        'ad_user_data': 'denied',
                        'ad_personalization': 'denied'
                    });
                }
            };
        </script>

        <!-- Cookie consent banner logic -->
        <script>
            'use strict';
            (function () {
                var STORAGE_KEY = 'cc_consent';

                function getStoredChoice() {
                    try { return window.localStorage.getItem(STORAGE_KEY); }
                    catch (e) { return null; }
                }
                function storeChoice(value) {
                    try { window.localStorage.setItem(STORAGE_KEY, value); }
                    catch (e) { /* private mode / storage disabled — banner will just reappear next visit */ }
                }

                // Runs once DOM is parsed enough for the banner elements to exist.
                document.addEventListener('DOMContentLoaded', function () {
                    var banner = document.getElementById('cc-banner');
                    if (!banner) { return; }

                    var existing = getStoredChoice();
                    if (existing === 'granted') {
                        window.updateConsent(true);
                    } else if (existing !== 'denied') {
                        // No choice recorded yet — show the banner
                        banner.classList.add('visible');
                    }
                    // if existing === 'denied', do nothing — default consent state is already denied

                    document.getElementById('cc-accept').addEventListener('click', function () {
                        window.updateConsent(true);
                        storeChoice('granted');
                        banner.classList.remove('visible');
                    });
                    document.getElementById('cc-reject').addEventListener('click', function () {
                        window.updateConsent(false);
                        storeChoice('denied');
                        banner.classList.remove('visible');
                    });
                });
            })();
        </script>

        <!-- Global error handling -->
        <script>
            'use strict';
            window.__IS_DEV__ = window.__IS_DEV__ || false;
            function safeLog() {
                if (window.__IS_DEV__) { console.error.apply(console, arguments); }
            }
            window.addEventListener('error', function(e) {
                if (e.error instanceof DOMException && e.error.name === 'DataCloneError' && e.message && e.message.includes('PerformanceServerTiming')) {
                    e.stopImmediatePropagation(); e.preventDefault();
                    if (typeof gtag !== 'undefined') { gtag('event', 'exception', { 'description': 'DataCloneError suppressed', 'fatal': false }); }
                    return true;
                }
                safeLog('Unhandled error:', e);
                if (typeof gtag !== 'undefined') { gtag('event', 'exception', { 'description': 'client_error', 'fatal': false }); }
                return false;
            }, true);
            window.addEventListener('unhandledrejection', function(e) {
                safeLog('Unhandled Promise Rejection:', e.reason);
                if (typeof gtag !== 'undefined') { gtag('event', 'exception', { 'description': 'unhandled_rejection', 'fatal': false }); }
                e.preventDefault();
            });
        </script>
